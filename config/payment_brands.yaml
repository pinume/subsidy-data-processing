# 回款明细的品类与品牌数据，从 processors/payment.py 挪出来，改这些不必碰代码。
#
# categories: 编码品类 -> 财务大类。顺序即汇总/明细排序里财务大类出现的顺序。
#
# brand_keywords: 品牌关键词，按品类（家电/数码）各一份列表；列表顺序就是匹配
# 优先级，一个商品名只要命中某条的任一关键词就归为该品牌，不再往下比对，所以
# 越靠前的品牌优先级越高（例如家电里“华为”排在“美的”前面，MATEBOOK 才不会被
# 误判成别的牌子）。
#
# brand_normalization（仅家电）：识别出的子品牌统一并入母品牌，例如 COLMO 计入
# 美的、卡萨帝计入海尔。
#
# midea_group（仅家电）：财务大类为洗衣机或冰箱时，美的、小天鹅、东芝三个牌子
# 进一步合并显示为“美的系”，与母品牌合并是两道独立的归并。
#
# brand_model_aliases（仅家电）：型号关键词直接对应品牌，用于商品名里不含品牌
# 关键词、只有型号的行；按运营核对逐条累积，会持续增加。

