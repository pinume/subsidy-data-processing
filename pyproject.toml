[project]
name = "subsidy-data-processing"
version = "0.1.0"
description = "统一处理大家电与数码 Excel 数据（仅 Linux）"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "openpyxl>=3.1.5",
    "pillow>=12.2.0",
    "python-calamine>=0.8.2",
    "pyyaml>=6.0.2",
    "xlsxwriter>=3.2.9",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-randomly>=4.1.0",
    "ruff==0.16.1",
    "mypy>=1.15",
    "types-openpyxl",
    "types-PyYAML",
]

# Limit lockfile resolution to Linux; runtime still enforces via require_linux().
[tool.uv]
environments = [
    "sys_platform == 'linux'",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
# Refuse to run under any other version: without this, `ruff check .` picks
# up whatever build happens to be on PATH, and a different default rule set
# reports a different number of problems for identical code.
required-version = "==0.16.1"
# target-version is deliberately unset — Ruff infers it from
# project.requires-python, so raising the minimum Python is a one-line edit.

[tool.ruff.lint]
# Deliberately narrow. These are the rules where a hit means the code is
# wrong (undefined name, unused import, syntax error) plus import ordering,
# which is mechanical and auto-fixable. Judgement-call families (B, UP, SIM,
# PERF, FURB, …) are left off on purpose: they report hundreds of
# suggestions here, several of which this project has consciously decided
# against, and that volume would bury the findings that actually matter.
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]

[tool.mypy]
python_version = "3.12"
files = ["main.py", "processors"]

# xlsxwriter 不发布 py.typed，也没有第三方 stubs。
[[tool.mypy.overrides]]
module = ["xlsxwriter.*"]
ignore_missing_imports = true

# 基线：引入 mypy 时这些文件共 39 个既有错误，一次清完不现实，
# 先把它们挡在门外，保证新代码和已清理的文件不再退化。
# 这个列表只许缩短，不许加新条目——新文件必须一开始就是干净的。
[[tool.mypy.overrides]]
module = [
    "processors.receipts",
    "processors.payment",
    "processors.coupon_report",
    "processors.coupons.sources",
    "processors.coupons.matching",
    "processors.coupons.appliance",
    "processors.coupons.validation",
]
ignore_errors = true
